name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reuse previous build's output/ so Ursus can rebuild incrementally.
      - uses: actions/cache@v4
        with:
          path: output
          key: ursus-output-${{ github.run_id }}
          restore-keys: ursus-output-

      - uses: jdx/mise-action@v5

      - run: mise setup

      - run: mise deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
